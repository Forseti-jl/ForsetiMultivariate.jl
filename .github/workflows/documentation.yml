name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pkg
      - uses: actions/checkout@v4
        with:
          repository: Forseti-jl/ForsetiCore.jl
          path: ForsetiCore.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Install package and docs dependencies
        run: |
          julia --project=pkg/docs -e '
            using Pkg
            Pkg.develop([PackageSpec(path="pkg"), PackageSpec(path="ForsetiCore.jl")])
            Pkg.instantiate()'
      - name: Build and deploy docs
        run: julia --project=pkg/docs pkg/docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
