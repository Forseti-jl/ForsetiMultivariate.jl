name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pkg
      - uses: actions/checkout@v4
        with:
          repository: Forseti-jl/ForsetiCore.jl
          path: ForsetiCore.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Develop sibling Forseti packages
        run: julia --project=pkg -e 'using Pkg; Pkg.develop([PackageSpec(path="ForsetiCore.jl")])'
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: pkg
      - uses: julia-actions/julia-runtest@v1
        with:
          project: pkg
